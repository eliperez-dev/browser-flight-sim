[package]
name = "browser-flight-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.6.1"
bevy = { version = "0.18.1" }
bevy_egui = "0.39"
noise = "0.9.0"
osmpbf = "0.3.8"
rand = "0.10.1"
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
tracing-wasm = "0.2"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "Window", "WebSocket", "MessageEvent", "BinaryType", "Blob", "ErrorEvent", "CloseEvent", "Request", "RequestInit", "RequestMode", "Response", "Headers", "Performance"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.wasm32-unknown-unknown]
runner = "wasm-server-runner"
